<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="50%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="foodBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#foodBg)"/>

  <!-- Subtle Decorative Grid / Pattern -->
  <g opacity="0.06" stroke="#9A3412" stroke-width="1.5" fill="none">
    <circle cx="400" cy="270" r="180"/>
    <circle cx="400" cy="270" r="220" stroke-dasharray="6,6"/>
    <circle cx="400" cy="270" r="260"/>
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#EA580C" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 40 70 L 40 40 L 70 40"/>
    <path d="M 760 70 L 760 40 L 730 40"/>
    <path d="M 40 530 L 40 560 L 70 560"/>
    <path d="M 760 530 L 760 560 L 730 560"/>
  </g>

  <!-- Central Icon Container -->
  <circle cx="400" cy="250" r="76" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(194, 65, 12, 0.12))"/>
  <circle cx="400" cy="250" r="66" fill="url(#foodBadge)"/>

  <!-- Food Icon: Cooking Pot & Ladle / Bowl Motif -->
  <g fill="#FFFFFF" transform="translate(400, 250)">
    <!-- Pot body -->
    <path d="M -32 -2 C -32 26, 32 26, 32 -2 Z" fill="#FFFFFF"/>
    <!-- Pot Rim -->
    <rect x="-36" y="-8" width="72" height="7" rx="3.5" fill="#FFFFFF"/>
    <!-- Lid handle -->
    <path d="M -8 -8 C -8 -16, 8 -16, 8 -8" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Steam waves -->
    <path d="M -16 -24 Q -12 -32 -16 -40" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 0 -26 Q 4 -34 0 -42" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 16 -24 Q 20 -32 16 -40" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Category Title & Subtitle -->
  <text x="400" y="375" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#7C2D12">
    Food &amp; Kitchen Products
  </text>
  <text x="400" y="410" text-anchor="middle" font-family="Noto Sans Devanagari, sans-serif" font-size="20" font-weight="600" fill="#9A3412">
    खाद्य व रसोई उत्पाद श्रेणी
  </text>

  <!-- Neutral Placeholder Notice Pill -->
  <rect x="250" y="445" width="300" height="38" rx="19" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <circle cx="272" cy="464" r="5" fill="#EA580C"/>
  <text x="405" y="469" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#9A3412">
    CATEGORY PLACEHOLDER
  </text>
</svg>
