<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="craftsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="craftsBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#craftsBg)"/>

  <!-- Subtle Decorative Grid / Pattern -->
  <g opacity="0.06" stroke="#78350F" stroke-width="1.5" fill="none">
    <circle cx="400" cy="270" r="180"/>
    <circle cx="400" cy="270" r="220" stroke-dasharray="6,6"/>
    <circle cx="400" cy="270" r="260"/>
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#D97706" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 40 70 L 40 40 L 70 40"/>
    <path d="M 760 70 L 760 40 L 730 40"/>
    <path d="M 40 530 L 40 560 L 70 560"/>
    <path d="M 760 530 L 760 560 L 730 560"/>
  </g>

  <!-- Central Icon Container -->
  <circle cx="400" cy="250" r="76" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(180, 83, 9, 0.12))"/>
  <circle cx="400" cy="250" r="66" fill="url(#craftsBadge)"/>

  <!-- Terracotta Clay Pot / Pottery Motif -->
  <g fill="#FFFFFF" transform="translate(400, 250)">
    <!-- Vase / Pot body -->
    <path d="M -16 -26 L 16 -26 C 18 -16, 32 0, 32 16 C 32 30, 18 32, 0 32 C -18 32, -32 30, -32 16 C -32 0, -18 -16, -16 -26 Z" fill="#FFFFFF"/>
    <!-- Pot rim -->
    <rect x="-20" y="-30" width="40" height="6" rx="3" fill="#FFFFFF"/>
    <!-- Decorative incised wave band -->
    <path d="M -24 14 Q -12 8 0 14 Q 12 20 24 14" stroke="#92400E" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Category Title & Subtitle -->
  <text x="400" y="375" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#78350F">
    Handicrafts &amp; Decor
  </text>
  <text x="400" y="410" text-anchor="middle" font-family="Noto Sans Devanagari, sans-serif" font-size="20" font-weight="600" fill="#92400E">
    हस्तशिल्प व सजावट श्रेणी
  </text>

  <!-- Neutral Placeholder Notice Pill -->
  <rect x="250" y="445" width="300" height="38" rx="19" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5"/>
  <circle cx="272" cy="464" r="5" fill="#D97706"/>
  <text x="405" y="469" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#92400E">
    CATEGORY PLACEHOLDER
  </text>
</svg>
