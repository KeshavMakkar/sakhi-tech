<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="herbalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="herbalBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#herbalBg)"/>

  <!-- Subtle Decorative Grid / Pattern -->
  <g opacity="0.06" stroke="#064E3B" stroke-width="1.5" fill="none">
    <circle cx="400" cy="270" r="180"/>
    <circle cx="400" cy="270" r="220" stroke-dasharray="6,6"/>
    <circle cx="400" cy="270" r="260"/>
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#059669" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 40 70 L 40 40 L 70 40"/>
    <path d="M 760 70 L 760 40 L 730 40"/>
    <path d="M 40 530 L 40 560 L 70 560"/>
    <path d="M 760 530 L 760 560 L 730 560"/>
  </g>

  <!-- Central Icon Container -->
  <circle cx="400" cy="250" r="76" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(4, 120, 87, 0.12))"/>
  <circle cx="400" cy="250" r="66" fill="url(#herbalBadge)"/>

  <!-- Herbal Leaf & Mortar Motif -->
  <g fill="#FFFFFF" transform="translate(400, 250)">
    <!-- Natural leaf shape -->
    <path d="M 0 -34 C 24 -18, 28 14, 0 32 C -28 14, -24 -18, 0 -34 Z" fill="#FFFFFF"/>
    <!-- Leaf central vein -->
    <line x1="0" y1="-30" x2="0" y2="28" stroke="#047857" stroke-width="2.5"/>
    <path d="M 0 -12 Q 10 -16 14 -12" stroke="#047857" stroke-width="2" fill="none"/>
    <path d="M 0 -2 Q 12 -6 16 -2" stroke="#047857" stroke-width="2" fill="none"/>
    <path d="M 0 8 Q 10 4 14 8" stroke="#047857" stroke-width="2" fill="none"/>
    <path d="M 0 -12 Q -10 -16 -14 -12" stroke="#047857" stroke-width="2" fill="none"/>
    <path d="M 0 -2 Q -12 -6 -16 -2" stroke="#047857" stroke-width="2" fill="none"/>
    <path d="M 0 8 Q -10 4 -14 8" stroke="#047857" stroke-width="2" fill="none"/>
  </g>

  <!-- Category Title & Subtitle -->
  <text x="400" y="375" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#064E3B">
    Herbal &amp; Wellness
  </text>
  <text x="400" y="410" text-anchor="middle" font-family="Noto Sans Devanagari, sans-serif" font-size="20" font-weight="600" fill="#047857">
    हर्बल व प्राकृतिक देखभाल
  </text>

  <!-- Neutral Placeholder Notice Pill -->
  <rect x="250" y="445" width="300" height="38" rx="19" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <circle cx="272" cy="464" r="5" fill="#059669"/>
  <text x="405" y="469" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#047857">
    CATEGORY PLACEHOLDER
  </text>
</svg>
