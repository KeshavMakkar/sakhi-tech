<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="clothingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="50%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="clothingBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#clothingBg)"/>

  <!-- Subtle Decorative Grid / Pattern -->
  <g opacity="0.06" stroke="#831843" stroke-width="1.5" fill="none">
    <circle cx="400" cy="270" r="180"/>
    <circle cx="400" cy="270" r="220" stroke-dasharray="6,6"/>
    <circle cx="400" cy="270" r="260"/>
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#DB2777" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 40 70 L 40 40 L 70 40"/>
    <path d="M 760 70 L 760 40 L 730 40"/>
    <path d="M 40 530 L 40 560 L 70 560"/>
    <path d="M 760 530 L 760 560 L 730 560"/>
  </g>

  <!-- Central Icon Container -->
  <circle cx="400" cy="250" r="76" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(157, 23, 77, 0.12))"/>
  <circle cx="400" cy="250" r="66" fill="url(#clothingBadge)"/>

  <!-- Clothing / Handloom Weave Icon -->
  <g fill="#FFFFFF" transform="translate(400, 250)">
    <!-- Spool / Weaving shuttle motif -->
    <rect x="-14" y="-30" width="28" height="60" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="-28" r="18" fill="#FFFFFF"/>
    <circle cx="0" cy="28" r="18" fill="#FFFFFF"/>
    <!-- Thread winding lines -->
    <line x1="-12" y1="-14" x2="12" y2="-14" stroke="#9D174D" stroke-width="3"/>
    <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#9D174D" stroke-width="3"/>
    <line x1="-12" y1="4" x2="12" y2="4" stroke="#9D174D" stroke-width="3"/>
    <line x1="-12" y1="13" x2="12" y2="13" stroke="#9D174D" stroke-width="3"/>
    <!-- Thread needle thread curve -->
    <path d="M 12 13 C 24 13, 34 26, 32 38" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Category Title & Subtitle -->
  <text x="400" y="375" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="28" font-weight="800" fill="#700733">
    Clothing &amp; Textiles
  </text>
  <text x="400" y="410" text-anchor="middle" font-family="Noto Sans Devanagari, sans-serif" font-size="20" font-weight="600" fill="#9D174D">
    वस्त्र व परिधान श्रेणी
  </text>

  <!-- Neutral Placeholder Notice Pill -->
  <rect x="250" y="445" width="300" height="38" rx="19" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.5"/>
  <circle cx="272" cy="464" r="5" fill="#DB2777"/>
  <text x="405" y="469" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#9D174D">
    CATEGORY PLACEHOLDER
  </text>
</svg>
